<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle Sports Card Studio</title>
<style>
:root{--ink:#17191d;--muted:#66717d;--line:#cfd7e1;--gold:#c9ab63;--silver:#e6ebf0;--ice:#eaf3fb;--ice2:#dceaf6;--slate:#edf0f3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8fbfe 0,#edf4fa 46%,#e4e9ef 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 16% 10%,#fff 0,transparent 23%),radial-gradient(circle at 84% 12%,#f0f3f7 0,transparent 25%),linear-gradient(120deg,transparent 0 46%,rgba(255,255,255,.9) 50%,transparent 54%)}
.app{max-width:1080px;margin:auto;padding:18px 14px 48px}.hero{text-align:center;padding:26px 8px 22px}.mark{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0,#f6f8fa 28%,#d9dee5 70%,#bfc6ce 100%);box-shadow:0 14px 34px rgba(75,84,96,.16),inset 0 0 0 1px #fff;position:relative}.mark:after{content:"";position:absolute;inset:16px;border-radius:50%;border:1px solid #a7afb9;box-shadow:0 0 18px #fff}.hero .eyebrow{font-size:.76rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#8a9199}.hero h1{margin:8px 0 8px;font-size:clamp(2.2rem,6vw,4rem);line-height:1;letter-spacing:-.045em}.hero p{max-width:620px;margin:auto;color:var(--muted);line-height:1.55;font-size:1rem}
.studio{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:18px}@media(max-width:860px){.studio{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,rgba(238,245,251,.98),rgba(225,234,242,.97));border:1px solid #cbd6e0;border-radius:30px;box-shadow:0 28px 80px rgba(64,74,86,.14),inset 0 1px 0 rgba(255,255,255,.9);padding:20px;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#e8edf2,var(--gold),#f5f7f9)}.label{font-size:.75rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#9097a0;margin-bottom:7px}.panel h2{margin:0 0 14px;font-size:1.3rem}.upload{display:grid;gap:12px}.thumb{position:relative;width:104px;height:104px;border-radius:22px;background:linear-gradient(145deg,#e7eef4,#d9e6f0);display:grid;place-items:center;overflow:hidden;color:#7d8792;text-align:center;font-size:.78rem;border:1px solid #d4dce4;flex:0 0 auto;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(74,84,96,.08)}.thumb img{width:100%;height:100%;object-fit:cover;display:none}.thumbControls{position:absolute;right:8px;top:8px;display:none;gap:6px;z-index:2}.thumbBtn{border:0;border-radius:999px;padding:7px 9px;background:rgba(17,20,24,.74);color:#fff;font:inherit;font-size:.72rem;font-weight:800;backdrop-filter:blur(10px);cursor:pointer}.picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pickButton{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #ccd3db;border-radius:14px;padding:11px 14px;background:#fff;color:#202328;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(85,95,108,.08)}.upload input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.describe{margin-top:18px}.describe textarea{width:100%;min-height:130px;border:0;background:transparent;border-radius:0;padding:0;color:#16181b;font:inherit;line-height:1.5;resize:vertical;box-shadow:none}.describe textarea:focus{outline:none;box-shadow:none}.create{border:1px solid #c7cdd4;border-radius:16px;padding:12px 16px;background:linear-gradient(135deg,#f8fbfe,#dfeaf3 52%,#eef5fa);box-shadow:0 10px 22px rgba(80,90,102,.10),inset 0 1px 0 #fff;color:#17191d;font:inherit;font-weight:950;cursor:pointer;white-space:nowrap}.create:disabled{opacity:.55;cursor:default}.composer{border:1px solid #d7dde4;border-radius:24px;background:linear-gradient(180deg,#f9fcff,#edf4fa);padding:14px;box-shadow:0 14px 34px rgba(72,82,94,.10),inset 0 1px 0 #fff}.attachmentRow{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.composerFooter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #edf0f3}.attachButton{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:#4f5964;font:inherit;font-weight:900;cursor:pointer;padding:8px 4px}.attachIcon{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:#dfe8f0;border:1px solid #cad5df;font-size:1rem;line-height:1}.status{min-height:22px;margin-top:10px;text-align:center;color:#737a83;font-size:.88rem}.status strong{color:#202328}
.previewHead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:13px}.previewHead span{color:#8a9199;font-size:.83rem}.canvas{min-height:650px;border:1px solid #dde2e7;border-radius:24px;background:radial-gradient(circle at 50% 28%,#f9fcff 0,#eaf3fb 44%,#dfe7ee 100%);display:grid;place-items:center;padding:18px;overflow:hidden}.empty{width:min(100%,480px);min-height:500px;display:grid;place-items:center;text-align:center;color:#8b929b;border:1px solid #e0e4e8;border-radius:22px;background:linear-gradient(145deg,#eef5fb,#dde9f3);padding:36px}.empty strong{display:block;color:#24272b;font-size:1.15rem;margin-bottom:7px}.result{max-width:100%;max-height:720px;border-radius:18px;box-shadow:0 30px 72px rgba(54,63,74,.2),0 0 0 1px #d9dfe5;background:white;display:none}.actions{display:flex;justify-content:center;margin-top:12px}.newBtn{display:none;border:0;background:transparent;color:#6f7680;font:inherit;font-weight:800;cursor:pointer;padding:8px 12px}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="mark" aria-hidden="true"></div>
    <div class="eyebrow">Oracle Card Studio</div>
    <h1>Make the card you imagined.</h1>
    <p>Upload a photo and describe the card in your own words. That’s it.</p>
  </header>

  <main class="studio">
    <section class="panel">
      <div class="label">Create</div>
      <h2>Describe your card</h2>
      <div class="composer" id="composer">
        <div class="attachmentRow">
          <div class="thumb" id="thumbBox">
            <img id="thumb" alt="">
            <span id="thumbText">＋<br><span style="font-size:.72rem;font-weight:800">Photo</span></span>
            <div id="thumbControls" class="thumbControls">
              <button id="replacePhoto" type="button" class="thumbBtn">Replace</button>
              <button id="removePhoto" type="button" class="thumbBtn">Remove</button>
            </div>
          </div>
          <div style="flex:1;min-width:0">
            <textarea id="message" placeholder="Make this a late-80s rookie card with a silver foil border, blue autograph and dramatic stadium lights."></textarea>
          </div>
        </div>
        <div class="composerFooter">
          <div>
            <label class="attachButton" for="photo"><span class="attachIcon">＋</span><span>Add image</span></label>
          </div>
          <button id="make" class="create">Create Card</button>
        </div>
        <input id="photo" type="file" accept="image/*">
      </div>
      <div id="status" class="status">Ready when you are.</div>
    </section>

    <section class="panel">
      <div class="previewHead">
        <div><div class="label">Your card</div><h2 style="margin:0">Finished design</h2></div>
        <span>Oracle Edition</span>
      </div>
      <div class="canvas">
        <div id="empty" class="empty"><div><strong>Your finished card appears here.</strong>Upload a photo, describe the look, and create.</div></div>
        <img id="resultImage" class="result" alt="Generated collectible card">
      </div>
      <div class="actions"><button id="newCard" class="newBtn">Create another</button></div>
    </section>
  </main>
</div>
<script src="./app.js"></script>
</body>
</html>
